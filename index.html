<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-Hub</title>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
        <title>Re-Hub</title>
        <meta name="description"
            content="Discover our physiotherapy and fitness centre combining rehab and functional training under one roof. We help all ages move better, recover faster, and build lasting resilience.">
        <link rel="canonical" href="https://re-hub.com.my/">
        <meta property="og:locale" content="en_US">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Re-Hub">
        <meta property="og:description"
            content="Discover our physiotherapy and fitness centre combining rehab and functional training under one roof. We help all ages move better, recover faster, and build lasting resilience.">
        <meta property="og:url" content="https://re-hub.com.my/">
        <meta property="og:site_name" content="Re-Hub">
        <link rel="stylesheet" href="style.min.css">
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    </head>

<body>
    <div class="container col">
        <div class="header row">
            <div class="section_content pad row">
                <img class="logo" src="assets/img/logo.png" alt="Re-Hub Logo">

                <nav class="row">
                    <a class="link row active" href="#">Home</a>
                    <div class="link row" href="#">Our Services
                        <span class="material-symbols-outlined">
                            keyboard_arrow_down
                        </span>
                    </div>
                    <a class="link row" href="#">About Us</a>
                    <a class="link row" href="#">Our Team</a>
                    <a class="link row" href="#">Contact Us</a>
                </nav>

                <a href="#" class="cta_btn">Book An Appointment</a>
            </div>
        </div>

        <section class="hero row">
            <div class="section_content col">
                <div class="hero_text col">
                    <div class="text_box col">
                        <h5 data-aos="flip-up">Elevating your comeback to your peak.</h5>
                        <h1 class="latte" data-aos="fade-right">WHERE<br>RECOVERY<br>MEETS</h1>
                        <h1 class="orange" data-aos="zoom-out-up">PERFORMANCE</h1>
                    </div>
                    <a class="cta_btn" href="#">About Re-Hub</a>
                </div>
                <div class="scroll_down col">
                    <div class="mouse col">
                        <div class="scroller"></div>
                    </div>
                    <span class="material-symbols-outlined">
                        keyboard_arrow_down
                    </span>
                </div>
            </div>
            <img src="assets/img/banner.jpg" alt="">
        </section>

        <section class="how_we_help col">
            <div class="section_title col">
                <h5>From Rehab to peak performance</h5>
                <h1><span class="latte">HOW WE HELP YOU</span> <br> <span class="orange">MOVE BETTER</span></h1>
            </div>
            <div class="section_content">

            </div>
        </section>
    </div>
</body>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
</script>
